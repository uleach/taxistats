[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxistats"
version = "0.1.0"
description = "Merge, de-duplicate and analyse Yandex Go ride-history JSON exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
taxistats = "taxistats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
